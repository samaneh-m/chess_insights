[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chess_insights"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "httpx",
    "python-chess",
    "pandas",
    "matplotlib",
    "tzdata",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["src/chess_insights"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
